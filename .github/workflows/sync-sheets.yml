# Синхронизация таблицы All_Tokens → D1 для админки (дилеры, кабинеты, доступы, здоровье токенов, журнал входов).
# Таблица только читается. Расписание — 5 раз в день (08, 11, 14, 17, 20 по Алматы), чтобы не тратить минуты GitHub;
# сразу после правки в таблице — кнопка «Синхронизировать сейчас» в админке или Actions → «Синхронизация таблиц» → Run workflow.
# Расписание: запускает сайт (Cloudflare Cron, worker/jobs.js SITE_CRONS) — расписание GitHub опаздывало на часы.
name: Синхронизация таблиц

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-sheets
  cancel-in-progress: false

# оболочка bash одинакова на GitHub-серверах и на своём компьютере (раннер на Windows)
defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_SERVICE_ACCOUNT: autoreport-github@astana-motors-accounts.iam.gserviceaccount.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0838b70724fe618572d61977794ba2e0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Схема базы D1
        run: npx wrangler d1 migrations apply autoreport --remote

      - name: Пауза?
        run: node etl/guard.mjs sync

      - name: Синхронизация
        if: env.SKIP != '1'
        run: node etl/quiet.mjs etl/sync_sheets.mjs
