# Ежедневная копия BigQuery → D1 для площадок, которые GitHub ещё не пишет сам (Apps Script грузит их в BigQuery ночью
# и срезает до Hub в 09:00). То, что загружено прямо из кабинетов («Восстановить»), не перезаписывается. BigQuery только читается.
# Само: каждый день в 09:30 по Алматы, затем пересчёт недолётов. Вручную — админка → «Задания» → «Копия из BigQuery».
# Расписание: запускает сайт (Cloudflare Cron, worker/jobs.js SITE_CRONS) — расписание GitHub опаздывало на часы.
name: Копия из BigQuery

on:
  workflow_dispatch:
    inputs:
      months:
        description: 'Месяцы: 2026-11 | 2026-07..2026-11 (пусто = текущий, до 10-го числа и прошлый)'
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: bq-bridge
  cancel-in-progress: false

# оболочка bash одинакова на GitHub-серверах и на своём компьютере (раннер на Windows)
defaults:
  run:
    shell: bash

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_SERVICE_ACCOUNT: autoreport-github@astana-motors-accounts.iam.gserviceaccount.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0838b70724fe618572d61977794ba2e0
      NODE_OPTIONS: --max-old-space-size=4096
      MONTHS: ${{ inputs.months }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Схема базы D1
        run: npx wrangler d1 migrations apply autoreport --remote

      - name: Пауза?
        run: node etl/guard.mjs bridge

      - name: Копия
        if: env.SKIP != '1'
        run: node etl/quiet.mjs etl/bq_bridge.mjs

      - name: Пересчёт недолётов
        if: env.SKIP != '1'
        env:
          MONTHS: ''
        run: node etl/quiet.mjs etl/gaps.mjs
