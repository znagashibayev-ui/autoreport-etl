# «Портал: запись в таблицу» (этап 5 переезда). Запускается сайтом портала autoreport-connect сразу после регистрации
# или обновления токена (через админку, у которой токен GitHub), и кнопкой «Повторить» в админке → «Подключения».
# Забирает заявки у портала по OIDC-токену GitHub (общих секретов нет), пишет их в таблицу All_Tokens
# (Total, Email_Access, реестр кабинетов, Onboarding_Audit), делает первую выгрузку TikTok / Яндекса новых дилеров,
# синхронизирует таблицы с D1 и запускает снимки дашборда.
name: 'Портал: запись в таблицу'

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: portal-apply
  cancel-in-progress: false

# оболочка bash одинакова на GitHub-серверах и на своём компьютере (раннер на Windows)
defaults:
  run:
    shell: bash

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PORTAL_URL: https://autoreport-connect.dm-astana-motors.kz
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_SERVICE_ACCOUNT: autoreport-github@astana-motors-accounts.iam.gserviceaccount.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0838b70724fe618572d61977794ba2e0
      GH_DISPATCH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Схема базы D1
        run: npx wrangler d1 migrations apply autoreport --remote

      - name: Запись заявок портала
        run: node etl/quiet.mjs etl/portal_apply.mjs
