# «Проверка токенов» (этап 5 переезда) — замена AUTH_Token_Health.gs в Apps Script.
# Каждый день в 07:15 по Алматы проверяет все токены листа Total (Meta, Google, TikTok, Яндекс): действует ли, когда истекает.
# Итог — лист Token_Health таблицы All_Tokens (как раньше) и раздел админки «Здоровье токенов».
# Ручной запуск по одному дилеру (кнопка «Проверить токен» в админке) пишет итог только в D1.
# Расписание: запускает сайт (Cloudflare Cron, worker/jobs.js SITE_CRONS) — расписание GitHub опаздывало на часы.
name: Проверка токенов

on:
  workflow_dispatch:
    inputs:
      dealers:
        description: 'Только эти Dealer_ID через запятую (пусто = все, тогда перезаписывается лист Token_Health)'
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: token-health
  cancel-in-progress: false

# оболочка bash одинакова на GitHub-серверах и на своём компьютере (раннер на Windows)
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTAL_URL: https://autoreport-connect.dm-astana-motors.kz
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_SERVICE_ACCOUNT: autoreport-github@astana-motors-accounts.iam.gserviceaccount.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0838b70724fe618572d61977794ba2e0
      DEALERS: ${{ inputs.dealers }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Схема базы D1
        run: npx wrangler d1 migrations apply autoreport --remote

      - name: Пауза?
        run: node etl/guard.mjs tokens

      - name: Проверка
        if: env.SKIP != '1'
        run: node etl/quiet.mjs etl/token_health.mjs
