# «Лимит Google Ads»: запросы к Google Ads API по часам из Google Cloud Monitoring → D1 (раздел сайта «Лимит Google Ads»).
# Запускает сайт каждый час (вместе с пересчётом недолётов).
name: 'Лимит Google Ads'

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: gads-usage
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_SERVICE_ACCOUNT: autoreport-github@astana-motors-accounts.iam.gserviceaccount.com
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GADS_GCP_PROJECT: ${{ vars.GADS_GCP_PROJECT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0838b70724fe618572d61977794ba2e0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Схема базы D1
        run: npx wrangler d1 migrations apply autoreport --remote
      - name: Запросы к Google Ads API по часам
        run: node etl/gads_usage.mjs
