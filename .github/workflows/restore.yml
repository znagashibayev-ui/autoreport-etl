# Восстановление недолётов: перезагрузить из рекламных кабинетов в D1 месяц дилера (или всех дилеров площадки),
# затем пересчитать недолёты. Запуск — кнопки «Восстановить» в админке (раздел «Недолёты») или админка → «Задания».
# Срез до Autoreport Hub делается при загрузке, как «Догрузить» в Apps Script. BigQuery и Apps Script не трогаются.
name: Восстановление недолётов
run-name: 'Восстановление · ${{ inputs.dealers || ''все дилеры'' }} · ${{ inputs.platforms }} · ${{ inputs.month }}'

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Месяц YYYY-MM'
        type: string
        required: true
      platforms:
        description: 'Площадки через пробел: yandex tiktok meta google'
        type: string
        required: true
      dealers:
        description: 'Только эти Dealer_ID через запятую (пусто = все дилеры площадки)'
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: restore-${{ inputs.month }}-${{ inputs.platforms }}-${{ inputs.dealers }}
  cancel-in-progress: false

# оболочка bash одинакова на GitHub-серверах и на своём компьютере (раннер на Windows)
defaults:
  run:
    shell: bash

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_SERVICE_ACCOUNT: autoreport-github@astana-motors-accounts.iam.gserviceaccount.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0838b70724fe618572d61977794ba2e0
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.SECRET_GOOGLE_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.SECRET_GOOGLE_CLIENT_SECRET }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.SECRET_GOOGLE_DEV_TOKEN }}
      NODE_OPTIONS: --max-old-space-size=4096
      MONTH: ${{ inputs.month }}
      PLATFORMS: ${{ inputs.platforms }}
      DEALERS: ${{ inputs.dealers }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Период
        # месяц целиком, но не дальше вчерашнего дня по Алматы (как mgReloadRange_)
        run: |
          echo "$MONTH" | grep -Eq '^20[0-9]{2}-(0[1-9]|1[0-2])$' || { echo "Неверный месяц: $MONTH"; exit 1; }
          echo "$PLATFORMS" | grep -Eq '^(yandex|tiktok|meta|google)( (yandex|tiktok|meta|google))*$' || { echo "Неверные площадки: $PLATFORMS"; exit 1; }
          START="$MONTH-01"
          LAST=$(date -u -d "$START +1 month -1 day" +%F)
          YDAY=$(TZ=Asia/Almaty date -d yesterday +%F)
          END=$([ "$LAST" \< "$YDAY" ] && echo "$LAST" || echo "$YDAY")
          [ "$END" \< "$START" ] && { echo "Месяц ещё не начался"; exit 1; }
          echo "START=$START" >> "$GITHUB_ENV"
          echo "END=$END" >> "$GITHUB_ENV"
          echo "Период: $START — $END"

      - run: npm ci

      - name: Схема базы D1
        run: npx wrangler d1 migrations apply autoreport --remote

      - name: Загрузка из кабинетов
        run: |
          rc=0
          for p in $PLATFORMS; do PLATFORM=$p NO_WRITE=0 node etl/quiet.mjs etl/run_platform.mjs || rc=1; done
          exit $rc

      - name: Пересчёт недолётов
        if: always()
        env:
          MONTHS: ${{ inputs.month }}
        run: node etl/quiet.mjs etl/gaps.mjs
