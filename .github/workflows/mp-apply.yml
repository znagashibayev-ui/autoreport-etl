# «Медиаплан: запись правок» — новые кампании и дневные бюджеты из админки (раздел «Медиапланы») в лист месяца медиаплана.
# Запускается сайтом сразу после «Записать в медиаплан». Пишет только имя/инструмент/цель новой кампании и доли «% от бюджета».
name: 'Медиаплан: запись правок'

on:
  workflow_dispatch:
    inputs:
      dealer:
        description: 'Dealer_ID (для названия запуска)'
        type: string
        default: ''

run-name: 'Медиаплан · ${{ inputs.dealer }}'

permissions:
  contents: read
  id-token: write

concurrency:
  group: mp-apply
  cancel-in-progress: false

# оболочка bash одинакова на GitHub-серверах и на своём компьютере (раннер на Windows)
defaults:
  run:
    shell: bash

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_SERVICE_ACCOUNT: autoreport-github@astana-motors-accounts.iam.gserviceaccount.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0838b70724fe618572d61977794ba2e0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Схема базы D1
        run: npx wrangler d1 migrations apply autoreport --remote

      - name: Запись в медиаплан
        run: node etl/quiet.mjs etl/mp_apply.mjs
