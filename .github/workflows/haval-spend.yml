# «Расход Haval/Tank» — расход рекламных кабинетов Haval/Tank (Meta, 22 кабинета, USD) → Cloudflare D1, таблица haval_spend.
# Источник: Worker fb-leads-haval (/report), ключ — секрет репозитория HAVAL_REPORT_KEY.
# Каждый день в 09:20 по Алматы заменяет последние 28 дней (Meta пересчитывает задним числом).
# История: Actions → «Расход Haval/Tank» → Run workflow → начало и конец (режется по 93 дня сама).
# Расписание: запускает сайт (Cloudflare Cron, worker/jobs.js SITE_CRONS) — расписание GitHub опаздывало на часы.
name: Расход Haval/Tank

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Начало YYYY-MM-DD (пусто = последние 28 дней)'
        type: string
        default: ''
      to:
        description: 'Конец YYYY-MM-DD (пусто = последние 28 дней)'
        type: string
        default: ''
      no_write:
        description: '1 = только забрать и показать итог, в базу не писать'
        type: choice
        default: '0'
        options: ['0', '1']

permissions:
  contents: read

concurrency:
  group: haval-spend
  cancel-in-progress: false

# оболочка bash одинакова на GitHub-серверах и на своём компьютере (раннер на Windows)
defaults:
  run:
    shell: bash

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0838b70724fe618572d61977794ba2e0
      HAVAL_REPORT_KEY: ${{ secrets.HAVAL_REPORT_KEY }}
      HAVAL_DEALERS_JSON: ${{ secrets.HAVAL_DEALERS_JSON }}
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      NO_WRITE: ${{ inputs.no_write }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Схема базы D1
        run: npx wrangler d1 migrations apply autoreport --remote

      - name: Пауза?
        run: node etl/guard.mjs haval

      - name: Загрузка
        if: env.SKIP != '1'
        run: node etl/quiet.mjs etl/haval_spend.mjs
