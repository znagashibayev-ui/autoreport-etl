# Ночная выгрузка площадок в Cloudflare D1 (этап 2+ переезда) со сверкой с BigQuery.
# Пока Apps Script работает параллельно, каждый прогон показывает, совпало ли с ним по каждому дилеру.
# Расписание (запускает сайт): 04:00 по Алматы — все площадки с записью в D1 (worker/jobs.js SITE_CRONS), затем пересчёт недолётов;
#   12:10 — все площадки без записи: свежие итоги кабинетов (cc_cabinet) для сверки «Недолётов» с реальными кабинетами;
#   снимки дашборда собираются сами после этого задания (snapshots.yml). Цель — свежие данные за вчера до 07:00.
# Ручной запуск: Actions → «Ночная выгрузка» → Run workflow (или админка → «Задания»).
# Проверочные запуски: push в ветку selftest-etl — параметры из etl/selftest-etl.json.
# Расписание: запускает сайт (Cloudflare Cron, worker/jobs.js SITE_CRONS) — расписание GitHub опаздывало на часы.
name: Ночная выгрузка

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Площадка'
        type: choice
        default: 'yandex tiktok meta google'
        options: [yandex, tiktok, meta, google, 'tiktok meta google', 'yandex tiktok meta google']
      start:
        description: 'Начало YYYY-MM-DD (пусто = с 1-го числа месяца)'
        type: string
        default: ''
      end:
        description: 'Конец YYYY-MM-DD (пусто = вчера)'
        type: string
        default: ''
      dealers:
        description: 'Только эти Dealer_ID через запятую (пусто = все)'
        type: string
        default: ''
      no_write:
        description: '1 = только собрать и сверить с BigQuery, в базу не писать'
        type: choice
        default: '0'
        options: ['0', '1']
  push:
    branches: [selftest-etl]

permissions:
  contents: read
  id-token: write

concurrency:
  group: etl-daily
  cancel-in-progress: false

# оболочка bash одинакова на GitHub-серверах и на своём компьютере (раннер на Windows)
defaults:
  run:
    shell: bash

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_SERVICE_ACCOUNT: autoreport-github@astana-motors-accounts.iam.gserviceaccount.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0838b70724fe618572d61977794ba2e0
      # ключи приложения Google Ads (были зашиты в GoogleAds_ETL.gs) — нужны только площадке google
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.SECRET_GOOGLE_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.SECRET_GOOGLE_CLIENT_SECRET }}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.SECRET_GOOGLE_DEV_TOKEN }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Параметры
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            for k in platform start end dealers no_write; do
              v=$(node -p "require('./etl/selftest-etl.json')['$k'] || ''")
              echo "$(echo $k | tr a-z A-Z)=$v" >> "$GITHUB_ENV"
            done
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PLATFORM=${{ inputs.platform }}" >> "$GITHUB_ENV"
            echo "START=${{ inputs.start }}" >> "$GITHUB_ENV"
            echo "END=${{ inputs.end }}" >> "$GITHUB_ENV"
            echo "DEALERS=${{ inputs.dealers }}" >> "$GITHUB_ENV"
            echo "NO_WRITE=${{ inputs.no_write }}" >> "$GITHUB_ENV"
          else
            echo "PLATFORM=yandex tiktok meta google" >> "$GITHUB_ENV"
          fi

      - run: npm ci

      - name: Схема базы D1
        run: npx wrangler d1 migrations apply autoreport --remote

      - name: Пауза?
        run: node etl/guard.mjs etl

      - name: Выгрузка
        if: env.SKIP != '1'
        # площадки по очереди; ошибка одной не останавливает остальные, но помечает запуск красным
        run: |
          rc=0
          for p in $PLATFORM; do PLATFORM=$p node etl/quiet.mjs etl/run_platform.mjs || rc=1; done
          exit $rc

      - name: Пересчёт недолётов
        # после выгрузки всех дилеров (с записью — ночная, без записи — дневная сверка с кабинетами в 12:10): недолёты по свежим итогам кабинетов
        if: always() && env.SKIP != '1' && env.DEALERS == ''
        run: node etl/quiet.mjs etl/gaps.mjs
